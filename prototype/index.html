<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskBoard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>TaskBoard</h1>
  </header>

  <!-- ボード -->
  <div class="board">

    <!-- リスト: TODO -->
    <div class="list">
      <div class="list-header">
        <span class="list-title" contenteditable="false">TODO</span>
        <div class="sort-bar">
          <button class="sort-btn" data-sort="due">📅 日付</button>
          <button class="sort-btn" data-sort="priority">🔥 優先度</button>
        </div>
        <button class="list-menu-btn">⋮</button>
        <div class="list-menu hidden">
          <button class="list-delete-btn">削除</button>
        </div>
      </div>
      <div class="cards">
        <div class="card" data-card-id="1" data-priority="urgent">
          <div class="card-priority urgent">緊急</div>
          <div class="card-title">デザインのレビュー</div>
          <div class="card-due overdue">📅 2026/06/25</div>
          <button class="card-menu-btn">⋮</button>
          <div class="card-menu hidden">
            <button class="card-move-up-btn">↑ 上に移動</button>
            <button class="card-move-down-btn">↓ 下に移動</button>
            <button class="card-delete-btn">削除</button>
          </div>
        </div>
        <div class="card" data-card-id="2" data-priority="high">
          <div class="card-priority high">高</div>
          <div class="card-title">API仕様書を書く</div>
          <div class="card-due today">📅 2026/06/30</div>
          <button class="card-menu-btn">⋮</button>
          <div class="card-menu hidden">
            <button class="card-move-up-btn">↑ 上に移動</button>
            <button class="card-move-down-btn">↓ 下に移動</button>
            <button class="card-delete-btn">削除</button>
          </div>
        </div>
        <div class="card" data-card-id="3" data-priority="low">
          <div class="card-priority low">低</div>
          <div class="card-title">ミーティング資料の準備</div>
          <div class="card-due">📅 2026/07/05</div>
          <button class="card-menu-btn">⋮</button>
          <div class="card-menu hidden">
            <button class="card-move-up-btn">↑ 上に移動</button>
            <button class="card-move-down-btn">↓ 下に移動</button>
            <button class="card-delete-btn">削除</button>
          </div>
        </div>
      </div>
      <button class="add-card-btn">＋ カードを追加</button>
    </div>

    <!-- リスト: 進行中 -->
    <div class="list">
      <div class="list-header">
        <span class="list-title" contenteditable="false">進行中</span>
        <div class="sort-bar">
          <button class="sort-btn" data-sort="due">📅 日付</button>
          <button class="sort-btn" data-sort="priority">🔥 優先度</button>
        </div>
        <button class="list-menu-btn">⋮</button>
        <div class="list-menu hidden">
          <button class="list-delete-btn">削除</button>
        </div>
      </div>
      <div class="cards">
        <div class="card" data-card-id="4" data-priority="medium">
          <div class="card-priority medium">中</div>
          <div class="card-title">バックエンドのDB設計</div>
          <div class="card-due">📅 2026/07/10</div>
          <button class="card-menu-btn">⋮</button>
          <div class="card-menu hidden">
            <button class="card-move-up-btn">↑ 上に移動</button>
            <button class="card-move-down-btn">↓ 下に移動</button>
            <button class="card-delete-btn">削除</button>
          </div>
        </div>
        <div class="card" data-card-id="5" data-priority="none">
          <div class="card-priority none"></div>
          <div class="card-title">Reactコンポーネント設計</div>
          <div class="card-due"></div>
          <button class="card-menu-btn">⋮</button>
          <div class="card-menu hidden">
            <button class="card-move-up-btn">↑ 上に移動</button>
            <button class="card-move-down-btn">↓ 下に移動</button>
            <button class="card-delete-btn">削除</button>
          </div>
        </div>
      </div>
      <button class="add-card-btn">＋ カードを追加</button>
    </div>

    <!-- リスト: 完了 -->
    <div class="list">
      <div class="list-header">
        <span class="list-title" contenteditable="false">完了</span>
        <div class="sort-bar">
          <button class="sort-btn" data-sort="due">📅 日付</button>
          <button class="sort-btn" data-sort="priority">🔥 優先度</button>
        </div>
        <button class="list-menu-btn">⋮</button>
        <div class="list-menu hidden">
          <button class="list-delete-btn">削除</button>
        </div>
      </div>
      <div class="cards">
        <div class="card" data-card-id="6" data-priority="high">
          <div class="card-priority high">高</div>
          <div class="card-title">要件定義書の作成</div>
          <div class="card-due">📅 2026/06/28</div>
          <button class="card-menu-btn">⋮</button>
          <div class="card-menu hidden">
            <button class="card-move-up-btn">↑ 上に移動</button>
            <button class="card-move-down-btn">↓ 下に移動</button>
            <button class="card-delete-btn">削除</button>
          </div>
        </div>
      </div>
      <button class="add-card-btn">＋ カードを追加</button>
    </div>

    <!-- リスト追加ボタン -->
    <button class="add-list-btn">＋ リストを追加</button>

  </div>

  <!-- カード詳細モーダル -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-body">

        <div class="modal-section">
          <label>タイトル</label>
          <input type="text" id="modal-title" class="modal-input" />
        </div>

        <div class="modal-section">
          <label>詳細メモ</label>
          <textarea id="modal-memo" class="modal-textarea" placeholder="メモを入力..."></textarea>
        </div>

        <div class="modal-section">
          <label>優先度</label>
          <div class="priority-selector">
            <button class="priority-btn" data-priority="urgent">🔴 緊急</button>
            <button class="priority-btn" data-priority="high">🟡 高</button>
            <button class="priority-btn" data-priority="medium">🔵 中</button>
            <button class="priority-btn" data-priority="low">🟢 低</button>
            <button class="priority-btn" data-priority="none">－ なし</button>
          </div>
        </div>

        <div class="modal-section">
          <label>期限日</label>
          <input type="date" id="modal-due" class="modal-input" />
        </div>

      </div>
    </div>
  </div>

  <!-- 削除確認ダイアログ -->
  <div class="modal-overlay hidden" id="confirm-overlay">
    <div class="confirm-dialog">
      <p>このリストを削除しますか？</p>
      <div class="confirm-actions">
        <button class="btn-delete" id="confirm-ok">削除する</button>
        <button class="btn-cancel" id="confirm-cancel">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
